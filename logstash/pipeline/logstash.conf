input {
  beats {
    port => 5044
  }
}

filter {
  # Remove ANSI colour-control sequences before parsing or storing a message.
  mutate {
    gsub => [
      "message", "\u001B\[[0-9;]*[mK]", ""
    ]
    strip => ["message"]
  }

  # Extract useful fields when an application writes JSON to stdout.
  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      target => "application_log"
      tag_on_failure => ["_application_json_parse_failure"]
    }

    if [application_log][message] {
      mutate { replace => { "message" => "%{[application_log][message]}" } }
    }

    if [application_log][timestamp] {
      date {
        match => ["[application_log][timestamp]", "ISO8601"]
        target => "@timestamp"
      }
    }

    # Promote the supported HTTP request fields to their ECS locations.  Keep
    # the application's JSON envelope out of the final event, but retain these
    # searchable fields for API dashboards and error investigations.
    if [application_log][http] {
      mutate { copy => { "[application_log][http]" => "[http]" } }
    }

    if [application_log][url] {
      mutate { copy => { "[application_log][url]" => "[url]" } }
    }
  }

  if [container][name] {
    mutate { copy => { "[container][name]" => "[service][name]" } }
  } else {
    mutate { add_field => { "[service][name]" => "unknown-service" } }
  }

  mutate {
    gsub => [
      "[service][name]", "^/", "",
      "[service][name]", "[^a-zA-Z0-9_-]", "_"
    ]
    lowercase => ["[service][name]"]
    add_field => {
      "[@metadata][local_log_file]" => "%{[service][name]}-%{+yyyy.MM.dd}.ndjson"
    }
  }

  if [container][labels][elk_service_type] {
    mutate { copy => { "[container][labels][elk_service_type]" => "[service][type]" } }
  } else {
    mutate { add_field => { "[service][type]" => "${LOG_SERVICE_TYPE}" } }
  }

  if [application_log][level] {
    mutate { copy => { "[application_log][level]" => "[log][level]" } }
  } else if [message] =~ /(?i)\b(error|fatal)\b/ {
    mutate { replace => { "[log][level]" => "error" } }
  } else if [message] =~ /(?i)\bwarn(ing)?\b/ {
    mutate { replace => { "[log][level]" => "warn" } }
  } else if [message] =~ /(?i)\bdebug\b/ {
    mutate { replace => { "[log][level]" => "debug" } }
  } else {
    mutate { replace => { "[log][level]" => "info" } }
  }

  mutate {
    lowercase => ["[log][level]", "[service][type]"]
    replace => {
      "[ecs][version]" => "8.0.0"
      "[event][dataset]" => "%{[service][name]}.application"
      "[event][kind]" => "event"
      "[host][name]" => "${LOG_HOST_IP}"
    }
  }

  # Discard Filebeat/Docker transport metadata and retain the canonical ECS event.
  prune {
    whitelist_names => [
      "^@timestamp$", "^ecs$", "^service$", "^event$", "^log$", "^message$", "^host$",
      "^http$", "^url$"
    ]
  }

  mutate {
    remove_field => ["[event][original]", "[log][file]", "[log][offset]"]
  }
}

output {
  file {
    path => "/srv/elk/logs/%{[@metadata][local_log_file]}"
    codec => json_lines
  }

  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    # Elasticsearch 9 reserves the `logs-*` pattern for data streams. This
    # pipeline uses normal index operations, so use a non-reserved prefix.
    index => "docker-logs-%{[service][name]}-%{+yyyy.MM.dd}"
  }
}
