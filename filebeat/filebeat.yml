# Start harvesters only for Docker containers that explicitly opt in.
# Add `elk_logs: "true"` under the service's `labels:` in its Compose file.
filebeat.autodiscover:
  providers:
    - type: docker
      host: "unix:///var/run/docker.sock"
      templates:
        - condition:
            equals:
              docker.container.labels.elk_logs: "true"
          config:
            - type: filestream
              id: container-${data.docker.container.id}
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              prospector.scanner.fingerprint.enabled: false
              parsers:
                - container:
                    stream: all
                    format: auto
              processors:
                - add_docker_metadata:
                    host: "unix:///var/run/docker.sock"

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
